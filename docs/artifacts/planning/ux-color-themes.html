<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX Color Themes — Finance Tracker</title>
    <style>
        :root {
            --radius: 12px;
            --pad: 16px
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial;
            background: #fff;
            color: #111;
            margin: 0
        }

        .wrap {
            padding: 24px
        }

        .theme {
            display: inline-block;
            width: 300px;
            border-radius: var(--radius);
            box-shadow: 0 6px 18px rgba(0, 0, 0, .06);
            margin: 12px;
            vertical-align: top
        }

        .swatch {
            height: 140px;
            border-top-left-radius: var(--radius);
            border-top-right-radius: var(--radius)
        }

        .meta {
            padding: 12px
        }

        .row {
            display: flex;
            gap: 8px;
            margin-top: 8px
        }

        .chip {
            padding: 6px 8px;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #eee;
            font-size: 13px
        }

        .preview-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #fff;
            border: none;
            cursor: pointer
        }

        .theme-name {
            font-weight: 600
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>UX Color Themes — Finance Tracker</h1>
        <p>Three starter themes. Click preview to open a small interactive sample (opens new tab).</p>

        <div id="themes"></div>
    </div>

    <script>
        const themes = [
            {
                id: 'calm-teal',
                name: 'Calm Teal',
                primary: '#0B6E4F',
                accent: '#FF8A65',
                surface: '#F7F7F8',
                text: '#111827',
            },
            {
                id: 'warm-minimal',
                name: 'Warm Minimal',
                primary: '#1F2937',
                accent: '#FFB86B',
                surface: '#FFFFFF',
                text: '#0F172A',
            },
            {
                id: 'midnight',
                name: 'Midnight (Dark)',
                primary: '#0F172A',
                accent: '#06B6D4',
                surface: '#0B1220',
                text: '#E6EEF6',
            }
        ];

        const container = document.getElementById('themes');
        themes.forEach(t => {
            const el = document.createElement('div'); el.className = 'theme';
            el.innerHTML = `
        <div class='swatch' style='background: linear-gradient(135deg, ${t.primary}, ${t.accent})'></div>
        <div class='meta'>
          <div class='theme-name'>${t.name}</div>
          <div class='row'>
            <div class='chip' style='background:${t.primary};color:#fff'>Primary</div>
            <div class='chip' style='background:${t.accent};color:#111'>Accent</div>
            <div class='chip' style='background:${t.surface};color:${t.text};border:1px solid #ddd'>Surface</div>
          </div>
          <button class='preview-btn' data-id='${t.id}'>Preview</button>
        </div>
      `;
            container.appendChild(el);
        });

        document.addEventListener('click', e => {
            const btn = e.target.closest('button[data-id]');
            if (!btn) return;
            const id = btn.getAttribute('data-id');
            const t = themes.find(x => x.id === id);
            const html = `<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content='width=device-width,initial-scale=1'><title>Preview ${t.name}</title><style>body{font-family:system-ui;padding:24px;background:${t.surface};color:${t.text}} .card{background:${t.primary};padding:16px;border-radius:12px;color:#fff;width:320px} .btn{background:${t.accent};padding:8px 12px;border-radius:8px;border:none;color:#000;display:inline-block;margin-top:12px}</style></head><body><h2>${t.name} theme</h2><div class='card'><h3>Quick Add</h3><p>Amount • Date • Category</p><button class='btn'>Save</button></div></body></html>`;
            const w = window.open('about:blank', '_blank');
            w.document.write(html);
            w.document.close();
        });
    </script>
</body>

</html>
