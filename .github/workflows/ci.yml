name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-fast:
    name: PR — Fast checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-pr-${{ hashFiles('bmad/app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (app)
        working-directory: ./bmad/app
        run: |
          set -euo pipefail
          npm ci

      - name: Run lint (if configured)
        working-directory: ./bmad/app
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(!(p.scripts && p.scripts.lint));"; then
            npm run lint
          else
            echo "No lint script in app/package.json"
          fi

      - name: Run fast unit tests (tests/ folder only)
        working-directory: ./bmad/app
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(!(p.scripts && p.scripts.test));"; then
            # Run only tests under the tests/ folder to keep PR runs fast
            npm test --silent -- --testPathPattern=tests
          else
            echo "No test script in app/package.json"
          fi

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-failure-artifacts
          path: |
            bmad/app/test-results/
            bmad/app/coverage/
          retention-days: 7

  merge-full:
    name: Merge — Full checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: []
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-main-${{ hashFiles('bmad/app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (app)
        working-directory: ./bmad/app
        run: |
          set -euo pipefail
          npm ci

      - name: Run lint (if configured)
        working-directory: ./bmad/app
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(!(p.scripts && p.scripts.lint));"; then
            npm run lint
          else
            echo "No lint script in app/package.json"
          fi

      - name: Run full tests (app)
        working-directory: ./bmad/app
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(!(p.scripts && p.scripts.test));"; then
            npm test --silent
          else
            echo "No test script in app/package.json"
          fi

      - name: TypeScript check (app)
        working-directory: ./bmad/app
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No tsconfig.json in app — skipping TypeScript check"
          fi

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merge-failure-artifacts
          path: |
            bmad/app/test-results/
            bmad/app/coverage/
          retention-days: 7

  mobile-tests:
    name: Mobile tests
    runs-on: ubuntu-latest
    needs: merge-full
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and run mobile tests (if any)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d bmad/mobile ]; then
            cd bmad/mobile
            if [ -f package.json ]; then
              npm ci
              if node -e "const p=require('./package.json'); process.exit(!(p.scripts && p.scripts.test));"; then
                npm test
              else
                echo "No test script in mobile/package.json"
              fi
            else
              echo "No package.json in mobile — skipping mobile tests"
            fi
          else
            echo "No mobile directory — skipping mobile tests"
          fi
